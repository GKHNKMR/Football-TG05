name: daily BETAVUS predictions

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betavus-predictions
  cancel-in-progress: false

jobs:
  build-and-update:
    if: ${{ !startsWith(github.event.head_commit.message, 'Update BETAVUS predictions') }}
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build predictions
        run: python scripts/update_predictions.py
      - name: Refresh football-data.co.uk CSVs
        run: python scripts/fetch_football_data.py
        continue-on-error: true
      - name: Build match stats
        run: python scripts/build_match_stats.py
      - name: Validate predictions
        run: |
          python - << 'PY'
          import json, sys
          from pathlib import Path
          p = Path("predictions.json")
          if not p.exists(): sys.exit("predictions.json missing")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, list): sys.exit("predictions.json must contain a list")
          if not data: sys.exit("predictions.json contains no fixtures")
          required = {"match_id", "league", "home", "away", "kickoff_utc", "p_over_0_5", "p_over_1_5", "p_over_2_5"}
          missing = required - set(data[0])
          if missing: sys.exit(f"Missing keys: {missing}")
          print(f"Validated {len(data)} fixtures")
          PY
      - name: Commit updated predictions
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add predictions.json data/cache data/football-data data/match-stats.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update BETAVUS predictions $(date -u +'%Y-%m-%d')"
            git push
          fi
