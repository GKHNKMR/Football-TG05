<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>BETAVUS — Football Goal Probability</title>
<style>
:root{--bg:#090b0f;--panel:#11151c;--panel2:#171c24;--line:#252c36;--text:#f4f6f8;--muted:#8e98a7;--accent:#e8ff3f;--good:#66e3a1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b222d 0,#090b0f 42%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 44px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:36px;font-weight:900;letter-spacing:-1.8px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.refresh{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.refresh:hover{background:var(--panel2)}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:7px;margin-bottom:16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#c7ced8;padding:9px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}.chip.active{background:var(--accent);border-color:var(--accent);color:#0b0d10}.datebar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 14px;color:var(--muted);font-size:13px}.table{background:rgba(17,21,28,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden}.head,.row{display:grid;grid-template-columns:minmax(270px,1fr) 90px 90px 90px;gap:8px;align-items:center}.head{padding:12px 14px;background:#0e1218;color:#697383;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.row{padding:14px;border-top:1px solid var(--line)}.match{min-width:0}.league{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:5px}.teams{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kick{font-size:11px;color:var(--muted);margin-top:5px}.prob{display:flex;justify-content:center}.pill{min-width:68px;text-align:center;padding:8px 5px;border-radius:9px;background:var(--panel2);font-weight:900;font-size:14px}.p05 .pill{border:1px solid rgba(102,227,161,.25)}
.pill.hot{animation:pillhot 1.15s ease-in-out infinite;border-color:var(--good)!important}
@keyframes pillhot{0%,100%{background:var(--panel2);color:var(--good);box-shadow:0 0 0 0 rgba(102,227,161,0)}50%{background:var(--good);color:#0b0d10;box-shadow:0 0 15px 1px rgba(102,227,161,.5)}}
@media(prefers-reduced-motion:reduce){.pill.hot{animation:none;background:var(--good);color:#0b0d10}}
.hotbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.hotbtn.on{border-color:var(--good);color:#0b0d10;background:var(--good)}
.dbar-right{display:flex;gap:9px;align-items:center}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:7px}.foot{margin-top:14px;color:#687383;font-size:11px;text-align:center}.loading{padding:38px;text-align:center;color:var(--muted)}.row{cursor:pointer}.row:hover{background:var(--panel2)}.row .teams::after{content:"›";color:var(--muted);font-weight:900;margin-left:7px}
@media(max-width:650px){.wrap{padding:20px 10px 32px}.top{align-items:center}.brand{font-size:29px}.sub{font-size:11px}.refresh{padding:9px 11px}.head,.row{grid-template-columns:minmax(0,1fr) 64px 64px 64px;gap:5px}.head{padding:10px 8px;font-size:9px}.row{padding:12px 8px}.teams{font-size:13px}.kick{font-size:10px}.pill{min-width:57px;padding:7px 2px;font-size:12px}.league{font-size:9px}.datebar{padding:0 2px}}
/* match stats drawer */
.sheet-bg{position:fixed;inset:0;background:rgba(3,5,8,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:38px 16px;overflow:auto;z-index:50}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.sheet h2{margin:0;font-size:19px;font-weight:900}
.sheet .s-sub{color:var(--muted);font-size:12px;margin-top:3px}
.sheet .s-close{float:right;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer;font-weight:900}
.s-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:13px}
.s-card h3{margin:0 0 9px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8ea0b6;font-weight:900}
.s-cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.s-stat{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.s-stat b{font-weight:800}
.s-team{font-size:14px;font-weight:900;margin-bottom:6px}
.form{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.fchip{min-width:26px;text-align:center;padding:4px 5px;border-radius:7px;font-size:11px;font-weight:900;background:#2a2f38}
.fchip.W{background:rgba(102,227,161,.20);color:#8ff0c0}.fchip.D{background:rgba(255,255,255,.09);color:#cdd6e2}.fchip.L{background:rgba(255,120,120,.18);color:#ff9d9d}
.fchip small{display:block;font-size:9px;font-weight:700;opacity:.75;margin-top:1px}
.h2h-row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid rgba(255,255,255,.05)}
.h2h-row .sc{font-weight:900}
.h2h-tot{color:var(--muted);font-size:11px;margin-left:6px}
.s-note{color:var(--muted);font-size:12px;padding:6px 0}
@media(max-width:650px){.sheet-bg{padding:0}.sheet{border-radius:0;min-height:100vh;max-width:none}.s-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">BETAVUS</div><div class="sub">Football Goal Probability Engine</div></div>
    <button class="refresh" id="refresh">↻ Yenile</button>
  </header>
  <nav class="filters" id="filters"></nav>
  <div class="datebar"><span id="window">Pazar–Pazar</span><span class="dbar-right"><button id="hotToggle" class="hotbtn" type="button">🟢 sadece yüksek 0.5+</button><span id="count"></span></span></div>
  <section class="table">
    <div class="head"><div>Maç</div><div>0.5+</div><div>1.5+</div><div>2.5+</div></div>
    <div id="rows"><div class="loading">Veriler yükleniyor…</div></div>
  </section>
  <div class="foot" id="updated">Fixture kaynağı: BETAVUS veri akışı · Analizler hazırlanıyor</div>
</div>
<div id="sheet" class="sheet-bg" hidden></div>
<script>
const leagues=['Tümü','Premier League','LaLiga','Bundesliga','Serie A','Ligue 1','Eredivisie'];
const DATA_URL='predictions.json';
const STATS_URL='data/match-stats.json';
let STATS={matches:{}};
const FALLBACK_DATA=[
 {match_id:'ED-F1',league:'Eredivisie',kickoff_utc:'2026-09-09T16:45:00Z',home:'FC Twente',away:'Telstar',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'BL-F1',league:'Bundesliga',kickoff_utc:'2026-09-11T18:30:00Z',home:'Union Berlin',away:'Schalke 04',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'LL-F1',league:'LaLiga',kickoff_utc:'2026-09-11T19:00:00Z',home:'Sevilla',away:'Valencia',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'SA-F1',league:'Serie A',kickoff_utc:'2026-09-11T18:45:00Z',home:'Venezia',away:'Fiorentina',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'L1-F1',league:'Ligue 1',kickoff_utc:'2026-09-11T18:45:00Z',home:'Rennes',away:'Marseille',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'PL-F1',league:'Premier League',kickoff_utc:'2026-09-12T14:00:00Z',home:'AFC Bournemouth',away:'Brentford',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'BL-F2',league:'Bundesliga',kickoff_utc:'2026-09-12T13:30:00Z',home:'Borussia Dortmund',away:'Paderborn',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'BL-F3',league:'Bundesliga',kickoff_utc:'2026-09-12T13:30:00Z',home:'Hoffenheim',away:'VfB Stuttgart',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'PL-F2',league:'Premier League',kickoff_utc:'2026-09-12T16:30:00Z',home:'Tottenham Hotspur',away:'Everton',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'LL-F2',league:'LaLiga',kickoff_utc:'2026-09-12T19:00:00Z',home:'Real Madrid',away:'Rayo Vallecano',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'SA-F2',league:'Serie A',kickoff_utc:'2026-09-13T16:00:00Z',home:'Napoli',away:'Bologna',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'L1-F2',league:'Ligue 1',kickoff_utc:'2026-09-13T18:45:00Z',home:'Brest',away:'Paris Saint-Germain',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null},
 {match_id:'ED-F2',league:'Eredivisie',kickoff_utc:'2026-09-13T18:00:00Z',home:'PSV',away:'Sparta Rotterdam',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null}
];
// Backtest'te 0.5+ için sürdürülebilir en yüksek isabet bölgesi ~%95; bu eşiğin
// üstündeki yüzdeler listede yeşil yanıp söner. Değiştirmek için tek yer burası.
const GREEN_MIN=0.95;
let data=[],selected='Tümü',hotOnly=false;
const filters=document.getElementById('filters'),rows=document.getElementById('rows');
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function localDate(iso){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Amsterdam'}).format(new Date(iso)).replace(',',' ·');}
function renderFilters(){filters.innerHTML=leagues.map(x=>`<button class="chip ${x===selected?'active':''}" data-league="${x}">${x}</button>`).join('');filters.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{selected=b.dataset.league;renderFilters();render();});}
function pct(v){return v==null?'—':`${(Number(v)*100).toFixed(1)}%`;}
function pill(v){const hot=v!=null&&Number(v)>=GREEN_MIN;return `<span class="pill${hot?' hot':''}">${pct(v)}</span>`;}
function weekWindow(){const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()+((7-s.getDay())%7));const e=new Date(s);e.setDate(e.getDate()+8);return[s,e];}
function fmtDay(d){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit'}).format(d);}
function visibleAll(list){const[start,end]=weekWindow();return list.filter(x=>selected==='Tümü'||x.league===selected).filter(x=>{const d=new Date(x.kickoff_utc);return d>=start&&d<end});}
function visible(list){let r=visibleAll(list);
  if(hotOnly)r=r.filter(x=>x.p_over_0_5!=null&&Number(x.p_over_0_5)>=GREEN_MIN).slice().sort((a,b)=>new Date(a.kickoff_utc)-new Date(b.kickoff_utc));
  return r;}
function render(){const list=visible(data);const[ws,we]=weekWindow();
  document.getElementById('window').textContent=`${fmtDay(ws)} – ${fmtDay(new Date(we-86400000))} · Pazar–Pazar`;
  const total=visibleAll(data).length;
  document.getElementById('count').textContent=hotOnly?`${list.length} / ${total} maç`:`${list.length} maç`;
  const hb=document.getElementById('hotToggle');hb.classList.toggle('on',hotOnly);
  hb.textContent=`🟢 sadece 0.5+ ≥ %${(GREEN_MIN*100).toFixed(0)}`;
  if(!list.length){rows.innerHTML=`<div class="empty"><strong>${hotOnly?'Bu hafta 0.5+ ≥ %'+(GREEN_MIN*100).toFixed(0)+' tahmin yok':'Bu aralıkta maç bulunamadı'}</strong>${hotOnly?'Eşiği düşürmeyi dene.':'Veri akışı kontrol ediliyor.'}</div>`;return;}
  rows.innerHTML=list.map(x=>`<div class="row" data-mid="${esc(x.match_id||'')}"><div class="match"><div class="league">${esc(x.league)}</div><div class="teams">${esc(x.home)} — ${esc(x.away)}</div><div class="kick">${localDate(x.kickoff_utc)}</div></div><div class="prob p05">${pill(x.p_over_0_5)}</div><div class="prob">${pill(x.p_over_1_5)}</div><div class="prob">${pill(x.p_over_2_5)}</div></div>`).join('');}
async function load(){rows.innerHTML='<div class="loading">Fikstürler yükleniyor…</div>';
  fetch(STATS_URL+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(s&&s.matches)STATS=s;}).catch(()=>{});
  try{const r=await fetch(DATA_URL+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('data');const remote=await r.json();data=(Array.isArray(remote)&&remote.length)?remote:FALLBACK_DATA;document.getElementById('updated').textContent=data===remote?'Fikstürler güncel · BETAVUS Poisson analiz motoru':'Canlı veri bağlantısı bekleniyor · Geçici fikstür gösteriliyor';render();}catch(e){data=FALLBACK_DATA;document.getElementById('updated').textContent='Canlı veri bağlantısı bekleniyor · Geçici fikstür gösteriliyor';render();}}

// ---- match stats drawer ----
const sheet=document.getElementById('sheet');
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';}
sheet.addEventListener('click',e=>{if(e.target===sheet||e.target.classList.contains('s-close'))closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
rows.addEventListener('click',e=>{const row=e.target.closest('.row[data-mid]');if(row&&row.dataset.mid)openSheet(row.dataset.mid);});
function n1(v){return v==null?'—':(Math.round(v*10)/10);}
function sline(k,v){return `<div class="s-stat"><span>${k}</span><b>${v}</b></div>`;}
function teamBlock(t){
  const s=t.season||{};
  if(!t.matched||!s.played){return `<div><div class="s-team">${esc(t.name)}</div><div class="s-note">Bu sezon CSV verisi yok.</div></div>`;}
  const form=(t.form||[]).map(f=>`<span class="fchip ${f.res}" title="${f.date} ${f.venue==='H'?'(E)':'(D)'} ${esc(f.opp)} ${f.gf}-${f.ga}">${f.res}<small>${f.gf}-${f.ga}</small></span>`).join('');
  return `<div>
    <div class="s-team">${esc(t.name)}</div>
    ${sline('Bu sezon (O-B-M)',`${s.w}-${s.d}-${s.l} · ${s.played} maç`)}
    ${sline('Attığı / yediği (ort.)',`${n1(s.gf_avg)} / ${n1(s.ga_avg)}`)}
    ${sline('2.5 Üst',s.over25_pct!=null?s.over25_pct+'%':'—')}
    ${sline('KG Var (BTTS)',s.btts_pct!=null?s.btts_pct+'%':'—')}
    ${sline('Gol yemediği',s.cs_pct!=null?s.cs_pct+'%':'—')}
    <div class="form">${form||'<span class="s-note">form verisi yok</span>'}</div>
  </div>`;
}
const S_HOME='#3987e5',S_AWAY='#d95926';
function goalChart(h,a){
  const HS=h.goals5||[],AS=a.goals5||[];
  const labels=(HS.length>=AS.length?HS:AS).map(g=>g.label);
  if(!labels.length) return '<div class="s-note">Sezon verisi yok.</div>';
  const val=arr=>labels.map((_,i)=>arr[i]&&arr[i].total_avg!=null?arr[i].total_avg:null);
  const hv=val(HS),av=val(AS),all=hv.concat(av).filter(v=>v!=null);
  if(all.length<2) return '<div class="s-note">Yeterli sezon verisi yok.</div>';
  const W=680,H=214,L=34,R=14,T=26,B=26,pw=W-L-R,ph=H-T-B;
  const ymax=Math.max(4,Math.ceil(Math.max(...all)));
  const X=i=>labels.length>1?L+i*(pw/(labels.length-1)):L+pw/2;
  const Y=v=>T+ph-(v/ymax)*ph;
  let g='';
  for(let t=0;t<=ymax;t++){const y=Y(t);g+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="#252c36"/><text x="${L-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#8e98a7">${t}</text>`;}
  const xl=labels.map((lb,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8e98a7">${esc(lb)}</text>`).join('');
  const draw=(vals,color,name)=>{
    let segs=[],cur=[];
    vals.forEach((v,i)=>{if(v==null){if(cur.length){segs.push(cur);cur=[];}}else cur.push([X(i),Y(v),i,v]);});
    if(cur.length)segs.push(cur);
    const lines=segs.filter(s=>s.length>1).map(s=>`<polyline points="${s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
    const dots=segs.flat().map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.3" fill="${color}"><title>${esc(name)} · ${esc(labels[p[2]])}: ${p[3]} gol/maç</title></circle>`).join('');
    return lines+dots;
  };
  const lgx2=L+Math.min(pw*0.55,240);
  const legend=`<circle cx="${L}" cy="12" r="3.5" fill="${S_HOME}"/><text x="${L+9}" y="15.5" font-size="10.5" fill="#8e98a7">${esc(h.name.length>22?h.name.slice(0,21)+'…':h.name)}</text>`+
    `<circle cx="${lgx2}" cy="12" r="3.5" fill="${S_AWAY}"/><text x="${lgx2+9}" y="15.5" font-size="10.5" fill="#8e98a7">${esc(a.name.length>22?a.name.slice(0,21)+'…':a.name)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:4px" role="img" aria-label="Son 5 sezon maç başına toplam gol ortalaması">`+
    g+xl+legend+draw(hv,S_HOME,h.name)+draw(av,S_AWAY,a.name)+
    `</svg><div class="s-note">Maç başına toplam gol (attığı + yediği), lig maçları · kaynak: football-data.co.uk</div>`;
}
function openSheet(mid){
  const m=STATS.matches&&STATS.matches[mid];
  sheet.hidden=false;
  if(!m){sheet.innerHTML=`<div class="sheet"><button class="s-close">×</button><h2>İstatistik yok</h2><div class="s-sub">Bu maç için CSV verisi bulunamadı.</div></div>`;return;}
  const h=m.home,a=m.away,x=m.h2h||{count:0,matches:[]};
  const h2hHead=x.count?`<div class="s-sub" style="margin-bottom:6px">Son ${x.count} maç · ${h.name} ${x.home_wins} – ${x.draws} B – ${x.away_wins} ${a.name} · ort. ${n1(x.avg_total)} gol · 2.5Ü ${x.over25_pct}% · KG ${x.btts_pct}%</div>`:'<div class="s-note">Kayıtlı karşılaşma yok.</div>';
  const h2hRows=(x.matches||[]).map(r=>`<div class="h2h-row"><span>${r.date.slice(2).replace(/-/g,'.')}</span><span>${esc(r.home)} <b class="sc">${r.score}</b> ${esc(r.away)}</span><span class="h2h-tot">${r.total} gol</span></div>`).join('');
  sheet.innerHTML=`<div class="sheet">
    <button class="s-close">×</button>
    <h2>${esc(h.name)} — ${esc(a.name)}</h2>
    <div class="s-sub">${esc(m.league)} · ${localDate(m.kickoff_utc)} · kaynak: football-data.co.uk</div>
    <div class="s-card"><h3>Aralarındaki maçlar (H2H)</h3>${h2hHead}${h2hRows}</div>
    <div class="s-card"><h3>Maç başına gol ortalaması · son 5 sezon</h3>${goalChart(h,a)}</div>
    <div class="s-card"><h3>Form &amp; sezon</h3><div class="s-cols">${teamBlock(h)}${teamBlock(a)}</div></div>
  </div>`;
}
document.getElementById('refresh').onclick=load;
document.getElementById('hotToggle').onclick=()=>{hotOnly=!hotOnly;render();};
renderFilters();load();
</script>
</body>
</html>
