<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>BETAVUS — Football Goal Probability</title>
<style>
:root{--bg:#090b0f;--panel:#11151c;--panel2:#171c24;--line:#252c36;--text:#f4f6f8;--muted:#8e98a7;--accent:#e8ff3f;--good:#66e3a1;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b222d 0,#090b0f 42%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 44px}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-size:36px;font-weight:900;letter-spacing:-1.8px}.sub{color:var(--muted);font-size:13px;margin-top:3px}.refresh{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}.refresh:hover{background:var(--panel2)}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:7px;margin-bottom:16px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:#c7ced8;padding:9px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}.chip.active{background:var(--accent);border-color:var(--accent);color:#0b0d10}.datebar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 14px;color:var(--muted);font-size:13px}.datebar strong{color:var(--text)}.table{background:rgba(17,21,28,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden}.head,.row{display:grid;grid-template-columns:minmax(270px,1fr) 90px 90px 90px;gap:8px;align-items:center}.head{padding:12px 14px;background:#0e1218;color:#697383;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.row{padding:14px;border-top:1px solid var(--line)}.match{min-width:0}.league{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:5px}.teams{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kick{font-size:11px;color:var(--muted);margin-top:5px}.prob{display:flex;justify-content:center}.pill{min-width:68px;text-align:center;padding:8px 5px;border-radius:9px;background:var(--panel2);font-weight:900;font-size:14px}.p05 .pill{border:1px solid rgba(102,227,161,.25)}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:7px}.foot{margin-top:14px;color:#687383;font-size:11px;text-align:center}.loading{padding:38px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{padding:20px 10px 32px}.top{align-items:center}.brand{font-size:29px}.sub{font-size:11px}.refresh{padding:9px 11px}.head,.row{grid-template-columns:minmax(0,1fr) 64px 64px 64px;gap:5px}.head{padding:10px 8px;font-size:9px}.row{padding:12px 8px}.teams{font-size:13px}.kick{font-size:10px}.pill{min-width:57px;padding:7px 2px;font-size:12px}.league{font-size:9px}.datebar{padding:0 2px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">BETAVUS</div><div class="sub">Football Goal Probability Engine</div></div>
    <button class="refresh" id="refresh">↻ Yenile</button>
  </header>
  <nav class="filters" id="filters"></nav>
  <div class="datebar"><span id="range">Bugün + 7 gün</span><span id="count"></span></div>
  <section class="table">
    <div class="head"><div>Maç</div><div>0.5+</div><div>1.5+</div><div>2.5+</div></div>
    <div id="rows"><div class="loading">Veriler yükleniyor…</div></div>
  </section>
  <div class="foot" id="updated">Veri kaynağı: API-Football · Hesaplama: BETAVUS Poisson modeli</div>
</div>
<script>
const leagues=['Tümü','Premier League','LaLiga','Bundesliga','Serie A','Ligue 1','Eredivisie'];
let data=[], selected='Tümü';
const filters=document.getElementById('filters'), rows=document.getElementById('rows');
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function localDate(iso){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Amsterdam'}).format(new Date(iso)).replace(',',' ·');}
function renderFilters(){filters.innerHTML=leagues.map(x=>`<button class="chip ${x===selected?'active':''}" data-league="${x}">${x}</button>`).join('');filters.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{selected=b.dataset.league;renderFilters();render();});}
function pct(v){return v==null?'—':`${(Number(v)*100).toFixed(1)}%`;}
function render(){
  const now=new Date(); const end=new Date(now.getTime()+7*86400000);
  const list=data.filter(x=>selected==='Tümü'||x.league===selected).filter(x=>{const d=new Date(x.kickoff_utc);return d>=now&&d<=end});
  document.getElementById('count').textContent=`${list.length} maç`;
  if(!list.length){rows.innerHTML='<div class="empty"><strong>Bu aralıkta maç bulunamadı</strong>Yeni veri geldiğinde burada görünecek.</div>';return;}
  rows.innerHTML=list.map(x=>`<div class="row"><div class="match"><div class="league">${esc(x.league)}</div><div class="teams">${esc(x.home)} — ${esc(x.away)}</div><div class="kick">${localDate(x.kickoff_utc)}</div></div><div class="prob p05"><span class="pill">${pct(x.p_over_0_5)}</span></div><div class="prob"><span class="pill">${pct(x.p_over_1_5)}</span></div><div class="prob"><span class="pill">${pct(x.p_over_2_5)}</span></div></div>`).join('');
}
async function load(){rows.innerHTML='<div class="loading">Veriler yükleniyor…</div>';try{const r=await fetch('predictions.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('data');data=await r.json();const latest=data.reduce((m,x)=>x.updated_at&&x.updated_at>m?x.updated_at:m,'');document.getElementById('updated').textContent=latest?`Son güncelleme: ${localDate(latest)} · Veri: API-Football · Model: BETAVUS Poisson`:'Veri kaynağı: API-Football · Model: BETAVUS Poisson';render();}catch(e){rows.innerHTML='<div class="empty"><strong>Veri dosyasına ulaşılamadı</strong>Otomatik veri güncellemesi çalıştığında tekrar deneyin.</div>';document.getElementById('count').textContent='';}}
document.getElementById('refresh').onclick=load;renderFilters();load();
</script>
</body>
</html>
