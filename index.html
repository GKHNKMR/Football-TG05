<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BETAVUS</title><style>body{font-family:Arial,sans-serif;background:#0b0d10;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:680px;padding:32px;text-align:center}h1{font-size:42px;margin:0 0 12px}p{color:#aeb4bd}.ok{color:#67e8a5}.bad{color:#ff7b7b}</style></head>
<body><main class="box"><h1>BETAVUS ⚽</h1><p>Football Goal Probability Engine</p><div id="status">Backend kontrol ediliyor...</div></main><script>fetch('/api/health').then(r=>r.json()).then(x=>{document.getElementById('status').innerHTML='<p class="ok">● Backend aktif — '+x.service+'</p>'}).catch(()=>{document.getElementById('status').innerHTML='<p class="bad">● Backend bağlantısı başarısız</p>'})</script></body></html>
