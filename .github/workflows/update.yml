name: hourly BETAVUS predictions

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"   # hourly — data only actually changes when the sources do
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betavus-predictions
  cancel-in-progress: false

jobs:
  build-and-update:
    if: ${{ !startsWith(github.event.head_commit.message, 'Update BETAVUS predictions') }}
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh football-data.co.uk CSVs + fixtures/odds
        run: python scripts/fetch_football_data.py
        continue-on-error: true
      - name: Fetch live scores (ESPN)
        run: python scripts/fetch_live_scores.py
        continue-on-error: true
      - name: Fetch Opta xG (Premier League blend only - see scripts/xg_blend.py)
        run: pip install --quiet duckdb && python scripts/fetch_opta_xg.py
        continue-on-error: true
      - name: Fetch key attacking players (see scripts/fetch_key_players.py)
        run: pip install --quiet duckdb && python scripts/fetch_key_players.py
        continue-on-error: true
      - name: Build predictions
        run: python scripts/update_predictions.py
      - name: Apply missing-key-player injury/suspension estimate (Transfermarkt)
        run: python scripts/fetch_injuries.py
        continue-on-error: true
      - name: Apply missing-key-player lineup adjustment (ESPN starting XI)
        run: python scripts/fetch_lineups.py
        continue-on-error: true
      - name: Grade past predictions
        run: python scripts/build_results.py && python scripts/build_5season_results.py
        continue-on-error: true
      - name: Build match stats
        run: python scripts/build_match_stats.py
      - name: Run model backtest
        run: python scripts/backtest.py
        continue-on-error: true
      - name: Build Istatistikler list + Bulten success banner (5 seasons + current season)
        run: python scripts/build_cifte_backtest.py
        continue-on-error: true
      - name: Build coupon suggestion rules + measured history (Sanal Kasa)
        run: python scripts/build_coupon_rules.py
        continue-on-error: true
      - name: Validate data (errors stop the publish, warnings go to the run summary)
        run: python scripts/validate_data.py
      - name: Commit updated predictions
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add predictions.json data/cache data/football-data data/match-stats.json data/h2h.json data/results.json data/predictions-archive.json data/backtest.json data/live-scores.json data/live-scores-debug.json data/opta-xg.json data/key-players.json data/stats-5season.json data/stats-summary.json data/coupon-rules.json js/cifte_backtest_data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update BETAVUS predictions $(date -u +'%Y-%m-%d')"
            # Arka arkaya iki push'ta bu çalışma bayat kalabilir: önce yeni main'in üstüne al.
            # Çakışmada bu çalışmanın taze ürettiği veri kazanır (rebase'de "theirs" = bizim commit).
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$pushed" = 1 ]
          fi
