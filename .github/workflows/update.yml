name: hourly BETAVUS predictions

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"   # hourly — data only actually changes when the sources do
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betavus-predictions
  cancel-in-progress: false

jobs:
  build-and-update:
    if: ${{ !startsWith(github.event.head_commit.message, 'Update BETAVUS predictions') }}
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh football-data.co.uk CSVs + fixtures/odds
        run: python scripts/fetch_football_data.py
        continue-on-error: true
      - name: Fetch live scores (ESPN)
        run: python scripts/fetch_live_scores.py
        continue-on-error: true
      - name: Fetch Opta xG (Premier League blend only - see scripts/xg_blend.py)
        run: pip install --quiet duckdb && python scripts/fetch_opta_xg.py
        continue-on-error: true
      - name: Fetch key attacking players (see scripts/fetch_key_players.py)
        run: pip install --quiet duckdb && python scripts/fetch_key_players.py
        continue-on-error: true
      - name: Build predictions
        run: python scripts/update_predictions.py
      - name: Apply missing-key-player injury/suspension estimate (Transfermarkt)
        run: python scripts/fetch_injuries.py
        continue-on-error: true
      - name: Apply missing-key-player lineup adjustment (ESPN starting XI)
        run: python scripts/fetch_lineups.py
        continue-on-error: true
      - name: Grade past predictions
        run: python scripts/build_results.py
        continue-on-error: true
      - name: Build match stats
        run: python scripts/build_match_stats.py
      - name: Run model backtest
        run: python scripts/backtest.py
        continue-on-error: true
      - name: Validate predictions
        run: |
          python - << 'PY'
          import json, sys
          from pathlib import Path
          p = Path("predictions.json")
          if not p.exists(): sys.exit("predictions.json missing")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(data, list): sys.exit("predictions.json must contain a list")
          if not data: sys.exit("predictions.json contains no fixtures")
          required = {"match_id", "league", "home", "away", "kickoff_utc", "p_over_0_5", "p_over_1_5", "p_over_2_5"}
          missing = required - set(data[0])
          if missing: sys.exit(f"Missing keys: {missing}")
          print(f"Validated {len(data)} fixtures")
          PY
      - name: Commit updated predictions
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add predictions.json data/cache data/football-data data/match-stats.json data/h2h.json data/results.json data/predictions-archive.json data/backtest.json data/live-scores.json data/live-scores-debug.json data/opta-xg.json data/key-players.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update BETAVUS predictions $(date -u +'%Y-%m-%d')"
            git push
          fi
