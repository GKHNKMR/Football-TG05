<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>BETAVUS — Football Goal Probability</title>
<style>
:root{
  --bg:#090b0f;--panel:#11151c;--panel2:#171c24;--line:#252c36;--text:#f4f6f8;
  --muted:#8e98a7;--accent:#e8ff3f;--accent-ink:#0b0d10;--good:#66e3a1;--good-ink:#0b0d10;
  --head:#0e1218;--headtext:#697383;--hair:rgba(255,255,255,.06);--bad:#ff9d9d;
}
:root[data-theme="light"]{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#eceff4;--line:#d7dde6;--text:#141a22;
  --muted:#5c6672;--accent:#3f6212;--accent-ink:#ffffff;--good:#0f9d58;--good-ink:#ffffff;
  --head:#eef1f6;--headtext:#8a94a1;--hair:rgba(0,0,0,.07);--bad:#c0392b;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1b222d 0,#090b0f 42%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
:root[data-theme="light"] body{background:#f3f5f9}
.wrap{max-width:1120px;margin:auto;padding:26px 18px 44px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand{font-size:34px;font-weight:900;letter-spacing:-1.8px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbtns{display:flex;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;min-width:38px;height:38px;padding:0 10px;cursor:pointer;font-weight:800;font-size:14px}
.iconbtn:hover{background:var(--panel2)}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;width:max-content}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer}
.tab.active{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:7px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.dbar-right{display:flex;gap:8px;align-items:center}
.sel{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;cursor:pointer}
.hotbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.hotbtn.on{border-color:var(--good);color:var(--good-ink);background:var(--good)}
.table{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.head,.row{display:grid;grid-template-columns:minmax(250px,1fr) 88px 88px 88px;gap:8px;align-items:center}
.head{padding:12px 14px;background:var(--head);color:var(--headtext);font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.row{padding:13px 14px;border-top:1px solid var(--line)}
.match{min-width:0}
.league{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.teams{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kick{font-size:11px;color:var(--muted);margin-top:5px}
.mkt{font-size:10.5px;color:var(--muted);margin-top:4px}
.prob{display:flex;justify-content:center}
.pill{min-width:66px;text-align:center;padding:8px 5px;border-radius:9px;background:var(--panel2);font-weight:900;font-size:14px}
.p05 .pill{border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.pill.hot{animation:pillhot 1.15s ease-in-out infinite;border-color:var(--good)!important}
@keyframes pillhot{0%,100%{background:var(--panel2);color:var(--good);box-shadow:0 0 0 0 transparent}50%{background:var(--good);color:var(--good-ink);box-shadow:0 0 15px 1px color-mix(in srgb,var(--good) 50%,transparent)}}
@media(prefers-reduced-motion:reduce){.pill.hot{animation:none;background:var(--good);color:var(--good-ink)}}
.badge{font-size:9px;letter-spacing:1px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 4px;font-weight:900}
.badge.b3{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.badge.b2{color:var(--text)}
.row{cursor:pointer}.row:hover{background:var(--panel2)}
.row .teams::after{content:"›";color:var(--muted);font-weight:900;margin-left:7px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:7px}
.foot{margin-top:16px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.7}
.foot a{color:var(--muted);font-weight:800}
.loading{padding:38px;text-align:center;color:var(--muted)}
/* results */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}
.tile .v{font-size:23px;font-weight:900;letter-spacing:-.5px}
.tile .k{color:var(--muted);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.tile .n{color:var(--muted);font-size:10.5px;margin-top:5px}
.rhead,.rrow{display:grid;grid-template-columns:52px minmax(160px,1fr) 76px 58px 44px 64px;gap:8px;align-items:center}
.rhead{padding:11px 14px;background:var(--head);color:var(--headtext);font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.rrow{padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px}
.rrow .rteam{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rrow .rsc{font-weight:900}
.hit{color:var(--good);font-weight:900}.miss{color:var(--bad);font-weight:900}
.edge{font-size:10px;color:var(--muted)}
@media(max-width:650px){
  .wrap{padding:18px 10px 32px}.brand{font-size:27px}
  .head,.row{grid-template-columns:minmax(0,1fr) 58px 58px 58px;gap:5px}
  .head{padding:10px 8px;font-size:9px}.row{padding:11px 8px}.teams{font-size:13px}.pill{min-width:52px;padding:7px 2px;font-size:12px}
  .tiles{grid-template-columns:1fr 1fr}
  .rhead,.rrow{grid-template-columns:44px minmax(0,1fr) 62px 48px 34px 52px;gap:5px;font-size:11.5px}
  .rhead{padding:9px 8px}.rrow{padding:10px 8px}
}
/* drawer + info modal */
.sheet-bg{position:fixed;inset:0;background:rgba(3,5,8,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:38px 16px;overflow:auto;z-index:50}
:root[data-theme="light"] .sheet-bg{background:rgba(20,26,34,.45)}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.sheet h2{margin:0;font-size:19px;font-weight:900}
.sheet .s-sub{color:var(--muted);font-size:12px;margin-top:3px}
.sheet .s-close{float:right;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer;font-weight:900}
.sheet p{font-size:13px;line-height:1.65;color:var(--text)}
.sheet .s-sub b{color:var(--text)}
.s-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:13px}
.s-card h3{margin:0 0 9px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:900}
.s-cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.s-stat{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--hair)}
.s-stat b{font-weight:800}
.s-team{font-size:14px;font-weight:900;margin-bottom:6px}
.form{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.fchip{min-width:26px;text-align:center;padding:4px 5px;border-radius:7px;font-size:11px;font-weight:900;background:var(--panel)}
.fchip.W{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.fchip.D{background:var(--hair);color:var(--muted)}
.fchip.L{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.fchip small{display:block;font-size:9px;font-weight:700;opacity:.75;margin-top:1px}
.h2h-row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--hair)}
.h2h-row .sc{font-weight:900}
.h2h-tot{color:var(--muted);font-size:11px;margin-left:6px}
.s-note{color:var(--muted);font-size:12px;padding:6px 0}
@media(max-width:650px){.sheet-bg{padding:0}.sheet{border-radius:0;min-height:100vh;max-width:none}.s-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">BETAVUS</div><div class="sub">Football Goal Probability Engine</div></div>
    <div class="topbtns">
      <button class="iconbtn" id="infoBtn" type="button" title="Nasıl hesaplanıyor?">?</button>
      <button class="iconbtn" id="themeBtn" type="button" title="Tema">🌙</button>
      <button class="iconbtn" id="refresh" type="button" title="Yenile">↻</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-pred" type="button">Tahminler</button>
    <button class="tab" id="tab-res" type="button">Sonuçlar</button>
  </div>

  <nav class="filters" id="filters"></nav>

  <section id="pane-pred">
    <div class="datebar">
      <span id="window">Pazar–Pazar</span>
      <span class="dbar-right">
        <select class="sel" id="hlSel" title="Vurgu"></select>
        <button id="hotToggle" class="hotbtn" type="button">sadece bunlar</button>
        <span id="count"></span>
      </span>
    </div>
    <div class="table">
      <div class="head"><div>Maç</div><div>0.5+</div><div>1.5+</div><div>2.5+</div></div>
      <div id="rows"><div class="loading">Veriler yükleniyor…</div></div>
    </div>
  </section>

  <section id="pane-res" hidden>
    <div id="resSummary"></div>
    <div class="table">
      <div class="rhead"><div>Tarih</div><div>Maç</div><div>Tahmin</div><div>Sonuç</div><div>2.5Ü</div><div>Başarı</div></div>
      <div id="resRows"><div class="loading">Yükleniyor…</div></div>
    </div>
    <div class="foot" id="resFoot"></div>
  </section>

  <div class="foot" id="updated">Analizler hazırlanıyor</div>
</div>

<div id="sheet" class="sheet-bg" hidden></div>
<script>
const leagues=['Tümü','Premier League','LaLiga','Bundesliga','Serie A','Ligue 1','Eredivisie'];
const DATA_URL='predictions.json',STATS_URL='data/match-stats.json',RES_URL='data/results.json';
let STATS={matches:{}},RESULTS=null;
const FALLBACK_DATA=[
 {match_id:'ED-F1',league:'Eredivisie',kickoff_utc:'2026-09-09T16:45:00Z',home:'FC Twente',away:'Telstar',p_over_0_5:null,p_over_1_5:null,p_over_2_5:null}
];

// Vurgu eşikleri — backtest'te her pazarın sürdürülebilir güven bölgesi
const HL={o05:{key:'p_over_0_5',min:0.95,label:'0.5+ ≥ %95'},
         o15:{key:'p_over_1_5',min:0.85,label:'1.5+ ≥ %85'},
         o25:{key:'p_over_2_5',min:0.70,label:'2.5+ ≥ %70'}};
const store=(k,d)=>{try{return localStorage.getItem('betavus.'+k)??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('betavus.'+k,v)}catch(e){}};

let tab=store('tab','pred');
let selected=store('league','Tümü');
let hlKey=store('hl','o05'); if(!HL[hlKey]&&hlKey!=='off')hlKey='o05';
let hotOnly=false;

const $=id=>document.getElementById(id);
const filters=$('filters'),rows=$('rows');
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function localDate(iso){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Amsterdam'}).format(new Date(iso)).replace(',',' ·');}
function shortDate(iso){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit'}).format(new Date(iso));}
function pct(v){return v==null?'—':`${(Number(v)*100).toFixed(1)}%`;}
function pctI(v){return v==null?'—':`${Math.round(Number(v)*100)}%`;}

function pillFor(v,lineKey){
  const h=HL[hlKey];
  const hot=h&&h.key===lineKey&&v!=null&&Number(v)>=h.min;
  return `<span class="pill${hot?' hot':''}">${pct(v)}</span>`;
}
function basisBadge(b){
  if(b==='form+h2h')return `<span class="badge b3" title="H2H + form'a dayanıyor (en sağlam)">●●●</span>`;
  if(b==='form')return `<span class="badge b2" title="Form'a dayanıyor">●●</span>`;
  if(b==='partial-form')return `<span class="badge b1" title="Sınırlı veri">●</span>`;
  return `<span class="badge b0" title="Sadece lig ortalaması (zayıf)">○</span>`;
}
function mktNote(m){
  if(!m||m.o25_implied==null)return '';
  const edge=m.edge25;
  const es=edge==null?'':` · edge ${edge>=0?'+':''}${Math.round(edge*100)}%`;
  return `<div class="mkt">piyasa 2.5Ü %${Math.round(m.o25_implied*100)}${es}</div>`;
}

function renderFilters(){
  filters.innerHTML=leagues.map(x=>`<button class="chip ${x===selected?'active':''}" data-league="${x}">${x}</button>`).join('');
  filters.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{selected=b.dataset.league;save('league',selected);renderFilters();renderAll();});
}
function renderHlSel(){
  const s=$('hlSel');
  s.innerHTML=`<option value="off">Vurgu: kapalı</option>`+Object.entries(HL).map(([k,v])=>`<option value="${k}">Vurgu: ${v.label}</option>`).join('');
  s.value=hlKey;
}

function weekWindow(){const s=new Date();s.setHours(0,0,0,0);s.setDate(s.getDate()+((7-s.getDay())%7));const e=new Date(s);e.setDate(e.getDate()+8);return[s,e];}
function fmtDay(d){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit'}).format(d);}
function visibleAll(list){const[start,end]=weekWindow();return list.filter(x=>selected==='Tümü'||x.league===selected).filter(x=>{const d=new Date(x.kickoff_utc);return d>=start&&d<end});}
function visible(list){let r=visibleAll(list);
  const h=HL[hlKey];
  if(hotOnly&&h)r=r.filter(x=>x[h.key]!=null&&Number(x[h.key])>=h.min);
  return r.slice().sort((a,b)=>new Date(a.kickoff_utc)-new Date(b.kickoff_utc));
}
function renderPred(){
  const list=visible(window.__data||[]);const[ws,we]=weekWindow();
  $('window').textContent=`${fmtDay(ws)} – ${fmtDay(new Date(we-86400000))} · Pazar–Pazar`;
  const total=visibleAll(window.__data||[]).length;
  const h=HL[hlKey];
  $('hotToggle').classList.toggle('on',hotOnly&&!!h);
  $('hotToggle').disabled=!h;
  $('hotToggle').style.opacity=h?1:.4;
  $('count').textContent=(hotOnly&&h)?`${list.length} / ${total} maç`:`${list.length} maç`;
  if(!list.length){rows.innerHTML=`<div class="empty"><strong>${hotOnly&&h?h.label+' tahmin yok':'Bu aralıkta maç bulunamadı'}</strong>${hotOnly&&h?'Eşiği gevşetmeyi dene.':'Veri akışı kontrol ediliyor.'}</div>`;return;}
  rows.innerHTML=list.map(x=>`<div class="row" data-mid="${esc(x.match_id||'')}">
    <div class="match">
      <div class="league">${basisBadge(x.basis)} ${esc(x.league)}</div>
      <div class="teams">${esc(x.home)} — ${esc(x.away)}</div>
      <div class="kick">${localDate(x.kickoff_utc)}</div>
      ${mktNote(x.market)}
    </div>
    <div class="prob p05">${pillFor(x.p_over_0_5,'p_over_0_5')}</div>
    <div class="prob">${pillFor(x.p_over_1_5,'p_over_1_5')}</div>
    <div class="prob">${pillFor(x.p_over_2_5,'p_over_2_5')}</div>
  </div>`).join('');
}

function tile(v,k,n){return `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div><div class="n">${n||''}</div></div>`;}
function renderResults(){
  const wrap=$('resSummary'),body=$('resRows'),foot=$('resFoot');
  if(!RESULTS){body.innerHTML='<div class="empty"><strong>Sonuç verisi yok</strong>İlk maçlar oynandıkça burası dolacak.</div>';wrap.innerHTML='';foot.textContent='';return;}
  let ms=RESULTS.matches||[];
  if(selected!=='Tümü')ms=ms.filter(m=>m.league===selected);
  const w=RESULTS.last_week||{},o=RESULTS.overall||{};
  wrap.innerHTML=`<div class="tiles">
    ${tile((w.acc_25??'—')+'%','2.5Ü isabet · son 7 gün',(w.n||0)+' maç')}
    ${tile((w.success_pct??'—')+'%','ortalama başarı','model doğruya koyduğu olasılık')}
    ${tile((o.acc_25??'—')+'%','2.5Ü · tüm dönem',(o.n||0)+' maç · '+RESULTS.result_days+' gün')}
  </div>`;
  if(!ms.length){body.innerHTML='<div class="empty"><strong>Bu lig için sonuç yok</strong></div>';foot.textContent='';return;}
  body.innerHTML=ms.map(m=>{
    const ok=m.hits&&m.hits.hit_25;
    const edge=('edge25'in m)?`<div class="edge">edge ${m.edge25>=0?'+':''}${Math.round(m.edge25*100)}%</div>`:'';
    return `<div class="rrow">
      <div>${shortDate(m.kickoff_utc)}</div>
      <div class="rteam" title="${esc(m.home)} — ${esc(m.away)}">${esc(m.home)} — ${esc(m.away)}</div>
      <div>λ ${m.pred_lambda??'—'}<br><span class="edge">2.5Ü ${pctI(m.p_over_2_5)}</span></div>
      <div class="rsc">${m.score}</div>
      <div class="${ok?'hit':'miss'}">${ok?'✓':'✗'}</div>
      <div>%${m.success_pct}${edge}</div>
    </div>`;
  }).join('');
  const rc=RESULTS.reconstructed_count||0;
  foot.innerHTML=`Son ${RESULTS.result_days} gün · λ ortalama hata ${o.lambda_mae??'—'} gol`+
    (o.value_acc!=null?` · piyasaya karşı yön isabeti %${o.value_acc}`:'')+
    (rc?`<br>* ${rc} maç geriye dönük, sızıntısız hesaplandı (arşiv dolana kadar). İlerisi gerçek tahmin arşividir.`:'');
}

function renderAll(){renderPred();renderResults();}

function setTab(t){
  tab=t;save('tab',t);
  $('tab-pred').classList.toggle('active',t==='pred');
  $('tab-res').classList.toggle('active',t==='res');
  $('pane-pred').hidden=t!=='pred';
  $('pane-res').hidden=t!=='res';
}

async function load(){
  rows.innerHTML='<div class="loading">Fikstürler yükleniyor…</div>';
  fetch(STATS_URL+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(s&&s.matches)STATS=s;}).catch(()=>{});
  fetch(RES_URL+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(s&&s.matches){RESULTS=s;renderResults();}}).catch(()=>{});
  try{
    const r=await fetch(DATA_URL+'?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('data');
    const remote=await r.json();
    window.__data=(Array.isArray(remote)&&remote.length)?remote:FALLBACK_DATA;
    const upd=remote[0]&&remote[0].updated_at;
    $('updated').innerHTML=`Kaynak: openfootball + football-data.co.uk · Poisson motoru`+
      (upd?` · güncelleme ${timeAgo(upd)}`:'')+
      ` · <a href="backtest.html">Model doğruluğu →</a>`;
  }catch(e){
    window.__data=FALLBACK_DATA;
    $('updated').innerHTML='Canlı veri bekleniyor · Geçici fikstür · <a href="backtest.html">Model doğruluğu →</a>';
  }
  renderAll();
}
function timeAgo(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+' dk önce';
  if(s<86400)return Math.round(s/3600)+' saat önce';
  return Math.round(s/86400)+' gün önce';
}

// ---- match stats drawer ----
const sheet=$('sheet');
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';}
sheet.addEventListener('click',e=>{if(e.target===sheet||e.target.classList.contains('s-close'))closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
rows.addEventListener('click',e=>{const row=e.target.closest('.row[data-mid]');if(row&&row.dataset.mid)openSheet(row.dataset.mid);});
function n1(v){return v==null?'—':(Math.round(v*10)/10);}
function sline(k,v){return `<div class="s-stat"><span>${k}</span><b>${v}</b></div>`;}
function teamBlock(t){
  const s=t.season||{};
  if(!t.matched||!s.played){return `<div><div class="s-team">${esc(t.name)}</div><div class="s-note">Bu sezon CSV verisi yok.</div></div>`;}
  const form=(t.form||[]).map(f=>`<span class="fchip ${f.res}" title="${f.date} ${f.venue==='H'?'(E)':'(D)'} ${esc(f.opp)} ${f.gf}-${f.ga}">${f.res}<small>${f.gf}-${f.ga}</small></span>`).join('');
  return `<div>
    <div class="s-team">${esc(t.name)}</div>
    ${sline('Bu sezon (O-B-M)',`${s.w}-${s.d}-${s.l} · ${s.played} maç`)}
    ${sline('Attığı / yediği (ort.)',`${n1(s.gf_avg)} / ${n1(s.ga_avg)}`)}
    ${sline('2.5 Üst',s.over25_pct!=null?s.over25_pct+'%':'—')}
    ${sline('KG Var (BTTS)',s.btts_pct!=null?s.btts_pct+'%':'—')}
    ${sline('Gol yemediği',s.cs_pct!=null?s.cs_pct+'%':'—')}
    <div class="form">${form||'<span class="s-note">form verisi yok</span>'}</div>
  </div>`;
}
const S_HOME='#3987e5',S_AWAY='#d95926';
function goalChart(h,a){
  const HS=h.goals5||[],AS=a.goals5||[];
  const labels=(HS.length>=AS.length?HS:AS).map(g=>g.label);
  if(!labels.length) return '<div class="s-note">Sezon verisi yok.</div>';
  const val=arr=>labels.map((_,i)=>arr[i]&&arr[i].total_avg!=null?arr[i].total_avg:null);
  const hv=val(HS),av=val(AS),all=hv.concat(av).filter(v=>v!=null);
  if(all.length<2) return '<div class="s-note">Yeterli sezon verisi yok.</div>';
  const W=680,H=214,L=34,R=14,T=26,B=26,pw=W-L-R,ph=H-T-B;
  const ymax=Math.max(4,Math.ceil(Math.max(...all)));
  const X=i=>labels.length>1?L+i*(pw/(labels.length-1)):L+pw/2;
  const Y=v=>T+ph-(v/ymax)*ph;
  let g='';
  for(let t=0;t<=ymax;t++){const y=Y(t);g+=`<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`;}
  const xl=labels.map((lb,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lb)}</text>`).join('');
  const draw=(vals,color,name)=>{
    let segs=[],cur=[];
    vals.forEach((v,i)=>{if(v==null){if(cur.length){segs.push(cur);cur=[];}}else cur.push([X(i),Y(v),i,v]);});
    if(cur.length)segs.push(cur);
    const lines=segs.filter(s=>s.length>1).map(s=>`<polyline points="${s.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
    const dots=segs.flat().map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.3" fill="${color}"><title>${esc(name)} · ${esc(labels[p[2]])}: ${p[3]} gol/maç</title></circle>`).join('');
    return lines+dots;
  };
  const lgx2=L+Math.min(pw*0.55,240);
  const legend=`<circle cx="${L}" cy="12" r="3.5" fill="${S_HOME}"/><text x="${L+9}" y="15.5" font-size="10.5" fill="var(--muted)">${esc(h.name.length>22?h.name.slice(0,21)+'…':h.name)}</text>`+
    `<circle cx="${lgx2}" cy="12" r="3.5" fill="${S_AWAY}"/><text x="${lgx2+9}" y="15.5" font-size="10.5" fill="var(--muted)">${esc(a.name.length>22?a.name.slice(0,21)+'…':a.name)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:4px" role="img" aria-label="Son 5 sezon maç başına toplam gol ortalaması">`+
    g+xl+legend+draw(hv,S_HOME,h.name)+draw(av,S_AWAY,a.name)+
    `</svg><div class="s-note">Maç başına toplam gol (attığı + yediği), lig maçları · kaynak: football-data.co.uk</div>`;
}
function openSheet(mid){
  const m=STATS.matches&&STATS.matches[mid];
  sheet.hidden=false;
  if(!m){sheet.innerHTML=`<div class="sheet"><button class="s-close">×</button><h2>İstatistik yok</h2><div class="s-sub">Bu maç için CSV verisi bulunamadı.</div></div>`;return;}
  const h=m.home,a=m.away,x=m.h2h||{count:0,matches:[]};
  const h2hHead=x.count?`<div class="s-sub" style="margin-bottom:6px">Son ${x.count} maç · ${h.name} ${x.home_wins} – ${x.draws} B – ${x.away_wins} ${a.name} · ort. ${n1(x.avg_total)} gol · 2.5Ü ${x.over25_pct}% · KG ${x.btts_pct}%</div>`:'<div class="s-note">Kayıtlı karşılaşma yok.</div>';
  const h2hRows=(x.matches||[]).map(r=>`<div class="h2h-row"><span>${r.date.slice(2).replace(/-/g,'.')}</span><span>${esc(r.home)} <b class="sc">${r.score}</b> ${esc(r.away)}</span><span class="h2h-tot">${r.total} gol</span></div>`).join('');
  sheet.innerHTML=`<div class="sheet">
    <button class="s-close">×</button>
    <h2>${esc(h.name)} — ${esc(a.name)}</h2>
    <div class="s-sub">${esc(m.league)} · ${localDate(m.kickoff_utc)} · kaynak: football-data.co.uk</div>
    <div class="s-card"><h3>Aralarındaki maçlar (H2H)</h3>${h2hHead}${h2hRows}</div>
    <div class="s-card"><h3>Maç başına gol ortalaması · son 5 sezon</h3>${goalChart(h,a)}</div>
    <div class="s-card"><h3>Form &amp; sezon</h3><div class="s-cols">${teamBlock(h)}${teamBlock(a)}</div></div>
  </div>`;
}

function openInfo(){
  sheet.hidden=false;
  sheet.innerHTML=`<div class="sheet">
    <button class="s-close">×</button>
    <h2>Nasıl hesaplanıyor?</h2>
    <div class="s-sub">BETAVUS bir <b>gol olasılığı</b> motoru — kimin kazanacağını değil, kaç gol olacağını tahmin eder.</div>
    <div class="s-card"><h3>Model</h3>
      <p>Her takımın <b>ev / deplasman</b> attığı ve yediği gol oranları, son 4 sezon yakın sezona daha çok ağırlık verilerek (1.0 / 0.7 / 0.45 / 0.30) çıkarılır. İki taraf birleştirilip beklenen toplam gol <b>λ</b> bulunur; 2+ kez karşılaşmışlarsa son karşılaşmaların gol ortalaması %28 ağırlıkla karıştırılır. λ bir <b>Poisson</b> dağılımına sokulup "en az 1 / 2 / 3 gol" olasılıkları verilir.</div>
    <div class="s-card"><h3>Rozetler</h3>
      <p><span class="badge b3">●●●</span> H2H + form'a dayanıyor (en sağlam) · <span class="badge b2">●●</span> forma dayanıyor · <span class="badge b0">○</span> sadece lig ortalaması (zayıf)</p>
      <p><b>Vurgu</b> seçtiğin pazarda backtest'te sürdürülebilir en yüksek isabet bölgesini yeşil yakar — garanti değil, "modelin en emin olduğu" demektir.</p></div>
    <div class="s-card"><h3>Dürüstlük</h3>
      <p>Model <b>kalibre</b>: "%60" dediğinde uzun vadede ~%60 gerçekleşir. Ama tek maç ayrıştırma gücü piyasanın çok az üstünde — <b>Sonuçlar</b> sekmesi ve <a href="backtest.html">Model doğruluğu</a> sayfası bunu açıkça gösterir. Kayıp garantisi yoktur.</p></div>
  </div>`;
}

// ---- wire ----
$('tab-pred').onclick=()=>setTab('pred');
$('tab-res').onclick=()=>setTab('res');
$('refresh').onclick=load;
$('infoBtn').onclick=openInfo;
$('hlSel').onchange=e=>{hlKey=e.target.value;save('hl',hlKey);if(!HL[hlKey])hotOnly=false;renderPred();};
$('hotToggle').onclick=()=>{if(!HL[hlKey])return;hotOnly=!hotOnly;renderPred();};

const themeBtn=$('themeBtn');
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  themeBtn.textContent=t==='light'?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').setAttribute('content',t==='light'?'#f3f5f9':'#090b0f');
}
applyTheme(store('theme','dark'));
themeBtn.onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';save('theme',t);applyTheme(t);};

renderHlSel();renderFilters();setTab(tab);load();
</script>
